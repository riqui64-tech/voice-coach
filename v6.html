<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Voice Coach 6.0</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111d;color:#f6f8fb;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.card{background:#0d1a29;border:1px solid #213951;border-radius:18px;padding:16px;margin:12px 0}.status{font-weight:900;color:#59d6a0}.btns{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:850;font-size:15px;background:#7aa8ff;color:#06111d;flex:1}.btn.end{background:#6d2e39;color:#fff}.btn.warn{background:#ffd479}.btn.alt{background:#18314b;color:#fff}.live{min-height:110px;padding:13px;border:1px dashed #35516b;border-radius:12px;white-space:pre-wrap;line-height:1.45;color:#d6e1ea}.q{font-size:16px;color:#ffd479;line-height:1.4}.cue{font-size:24px;line-height:1.42;font-weight:800}.full{font-size:18px;line-height:1.5;white-space:pre-wrap;margin-top:12px;padding-top:12px;border-top:1px solid #28445d}.pill{display:inline-block;border:1px solid #35516b;border-radius:999px;padding:4px 8px;font-size:12px;color:#a9bdcc;margin:2px}.small{font-size:12px;color:#8fa5b7}.error{color:#ff9494}.debug{display:none}.debug.on{display:block}.log{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;max-height:260px;overflow:auto;background:#07131f;border-radius:12px;padding:12px;border:1px solid #203a52}select{width:100%;padding:11px;border-radius:11px;background:#07131f;color:white;border:1px solid #294862}@media(max-width:600px){.wrap{padding:10px}.top{flex-direction:column}.cue{font-size:21px}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="margin:0;font-size:26px">Voice Coach 6.0</h1><div class="small">Continuous Conversation Observer</div></div><div id="status" class="status">● Ready</div></div><div class="card"><div class="btns"><button id="start" class="btn">Start Interview</button><button id="answerNow" class="btn warn" disabled>⚡ Answer Now</button><button id="debugToggle" class="btn alt">Debug</button><button id="end" class="btn end" disabled>■ End</button></div><div style="margin-top:10px"><select id="depth"><option value="simple">Turbo simple</option><option value="technical">Technical backup</option><option value="deep">Deep / Sol Fast</option></select></div><div id="error" class="error"></div></div><div class="card"><div class="small">LIVE CONVERSATION</div><div id="live" class="live">Microphone is idle.</div><div style="margin-top:10px"><span id="mic" class="pill">Mic: idle</span><span id="speaker" class="pill">Speaker: —</span><span id="intent" class="pill">Intent: —</span><span id="latency" class="pill">Latency: —</span></div></div><div class="card"><div class="small">QUESTION</div><div id="question" class="q">Waiting for an interviewer question…</div></div><div class="card"><div class="small">START WITH THIS</div><div id="cue" class="cue">Start once and speak naturally.</div><div id="full" class="full" hidden></div><div class="btns" style="margin-top:12px"><button id="stop" class="btn alt" disabled>Stop Response</button></div></div><div id="debug" class="card debug"><div class="small">DEBUG TRACE</div><div id="log" class="log">No events yet.</div></div></main><script>
const $=s=>document.querySelector(s);let rec=null,running=false,active=false,finalText='',partial='',timer=null,observeController=null,answerController=null,rolling=[],recentContext=[],generation=0,lastSpeech=0,lastAnsweredKey='',debug=false;const SILENCE=850,WATCHDOG=2100,ROLLING_MS=60000,MERGE_MS=2600;
function n(){return Date.now()}function pending(){return(finalText+' '+partial).replace(/\s+/g,' ').trim()}function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}function key(s){return norm(s).slice(-600)}function setStatus(s){$('#status').textContent='● '+s}function controls(){$('#start').disabled=active;$('#end').disabled=!active;$('#answerNow').disabled=!active;$('#stop').disabled=!answerController}function trim(){const c=n()-ROLLING_MS;rolling=rolling.filter(x=>x.t>=c)}function rollText(){trim();return rolling.map(x=>x.text).join(' ').replace(/\s+/g,' ').trim()}function render(){trim();$('#live').textContent=[rolling.map(x=>x.text).join('\n'),pending()].filter(Boolean).join('\n')||'Listening…'}function addRoll(t){const s=String(t||'').trim();if(!s)return;trim();const last=rolling[rolling.length-1];if(last&&n()-last.t<MERGE_MS){last.text=(last.text+' '+s).replace(/\s+/g,' ').trim();last.t=n()}else rolling.push({t:n(),text:s});render()}function archive(){const s=pending();if(s)addRoll(s);finalText='';partial='';render();return s}function log(x){if(!debug)return;const box=$('#log');const stamp=new Date().toLocaleTimeString();box.textContent=(box.textContent==='No events yet.'?'':box.textContent+'\n')+`[${stamp}] ${x}`;box.scrollTop=box.scrollHeight}
function firstSentence(s){const t=String(s||'').trim();if(!t)return'';const m=t.match(/^(.+?[.!?])(?:\s|$)/);return m?m[1]:t.split(/\n/)[0]}
function obvious(s){const t=norm(s);if(t.length<8)return false;return /\b(walk me through|talk me through|take me through|tell me about|tell me more|describe a time|give me an example|explain how|explain why|help me understand|what would you|how would you|how do you|what do you|why do you|why are you|what are you|can you|could you|would you|have you|have you ever|let s say|suppose|imagine|and jamf|what next|how so)\b/.test(t)||(/^(what|why|how|when|where|who|which|can|could|would|do|did|does|are|is|have|has)\b/.test(t)&&t.split(' ').length>=3)}
function likelyCandidate(s){const t=norm(s);return /^(i |i d |i would |i usually |i first |my approach |in my |at braze |at electric |what i would do |the first thing i )/.test(t)&&!obvious(t)}
function schedule(){clearTimeout(timer);lastSpeech=n();timer=setTimeout(()=>route(false),SILENCE)}
async function route(force){if(!active)return;const seg=pending();if(!seg)return;if(key(seg)===lastAnsweredKey)return;clearTimeout(timer);if(obvious(seg)&&!likelyCandidate(seg)){const raw=archive();$('#speaker').textContent='Speaker: interviewer';$('#intent').textContent='Intent: answer';log('fast-path obvious question');lastAnsweredKey=key(raw);$('#question').textContent=raw;generate(raw,rollText()||raw);return}await observe(seg,force)}
async function observe(seg,force){if(observeController)observeController.abort();observeController=new AbortController();$('#intent').textContent=force?'Intent: recovery…':'Intent: observing…';log('observer check');try{const r=await fetch('/api/observe',{method:'POST',headers:{'Content-Type':'application/json'},signal:observeController.signal,body:JSON.stringify({latest:seg,rollingTranscript:rollText(),recentContext})});if(!r.ok)throw new Error(await r.text());const d=await r.json();$('#speaker').textContent='Speaker: '+String(d.speaker||'').toLowerCase();$('#intent').textContent='Intent: '+String(d.action||'').toLowerCase()+' '+Math.round((Number(d.confidence)||0)*100)+'%';log(`${d.speaker}/${d.action} ${Math.round((Number(d.confidence)||0)*100)}% ${d.reason||''}`);if(d.action==='ANSWER'||(force&&d.action!=='IGNORE'&&!likelyCandidate(seg))){const raw=archive();const q=String(d.question||raw).trim();lastAnsweredKey=key(raw);$('#question').textContent=q;generate(q,rollText()||raw);return}if(d.action==='WAIT'&&!force){timer=setTimeout(()=>route(false),900);return}if(force&&!likelyCandidate(seg)&&seg.split(/\s+/).length>=4){const raw=archive();lastAnsweredKey=key(raw);$('#question').textContent=raw;log('watchdog forced answer');generate(raw,rollText()||raw);return}archive();setStatus('Listening');}catch(e){if(e.name!=='AbortError'){log('observer error '+e.message);if(force){const raw=archive();if(raw&&!likelyCandidate(raw)){lastAnsweredKey=key(raw);$('#question').textContent=raw;generate(raw,rollText()||raw)}}else timer=setTimeout(()=>{if(active&&pending())route(true)},WATCHDOG)}}finally{observeController=null}}
async function generate(q,context){if(answerController)answerController.abort();answerController=new AbortController();controls();const id=++generation,t0=performance.now();$('#cue').textContent='';$('#full').textContent='';$('#full').hidden=true;setStatus('Generating');log('generation start');try{const prompt=context&&norm(context)!==norm(q)?`Recent live interview context:\n${context}\n\nLatest interviewer question to answer:\n${q}`:q;const r=await fetch('/api/stream',{method:'POST',headers:{'Content-Type':'application/json'},signal:answerController.signal,body:JSON.stringify({question:prompt,depth:$('#depth').value,recentContext})});if(!r.ok)throw new Error(await r.text());const reader=r.body.getReader(),dec=new TextDecoder();let all='',first=true;while(true){const{done,value}=await reader.read();if(done)break;if(id!==generation)return;const chunk=dec.decode(value,{stream:true});if(first&&chunk){first=false;$('#latency').textContent='Latency: '+Math.round(performance.now()-t0)+' ms';log('first token '+Math.round(performance.now()-t0)+'ms')}all+=chunk;const cut=all.indexOf('<<<DETAILS_JSON>>>');const spoken=(cut>=0?all.slice(0,cut):all).trim();const cue=firstSentence(spoken);$('#cue').textContent=cue;$('#full').textContent=spoken;$('#full').hidden=!spoken||spoken===cue}const cut=all.indexOf('<<<DETAILS_JSON>>>'),spoken=(cut>=0?all.slice(0,cut):all).trim();if(spoken){recentContext.push({question:q,answer:spoken});recentContext=recentContext.slice(-6)}setStatus('Listening');$('#intent').textContent='Intent: waiting'}catch(e){if(e.name!=='AbortError'){$('#error').textContent='Response failed: '+e.message;log('generation error '+e.message);setStatus('Listening')}}finally{if(id===generation){answerController=null;controls()}}}
function ensureRec(){if(running||!active)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#error').textContent='Speech recognition not supported here.';return}rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';rec.onstart=()=>{running=true;$('#mic').textContent='Mic: listening';setStatus('Listening');log('recognizer started')};rec.onresult=e=>{let f='',p='';for(let i=e.resultIndex;i<e.results.length;i++){const s=e.results[i][0].transcript;if(e.results[i].isFinal)f+=' '+s;else p+=' '+s}if(f.trim())finalText=(finalText+' '+f).replace(/\s+/g,' ').trim();partial=p.trim();render();schedule()};rec.onerror=e=>{if(!['aborted','no-speech'].includes(e.error)){$('#error').textContent='Mic: '+e.error;log('mic error '+e.error)}};rec.onend=()=>{running=false;if(active)setTimeout(ensureRec,180)};try{rec.start()}catch{running=false}}
$('#start').onclick=()=>{active=true;rolling=[];recentContext=[];finalText='';partial='';lastAnsweredKey='';$('#error').textContent='';$('#question').textContent='Waiting for an interviewer question…';$('#cue').textContent='Listening for the interview…';$('#full').hidden=true;controls();ensureRec()};$('#end').onclick=()=>{active=false;clearTimeout(timer);try{rec?.abort()}catch{}if(observeController)observeController.abort();if(answerController)answerController.abort();answerController=null;running=false;$('#mic').textContent='Mic: idle';setStatus('Stopped');controls();log('interview stopped')};$('#answerNow').onclick=()=>{const current=pending();const context=[rollText(),current].filter(Boolean).join(' ').trim();if(context){if(current)archive();lastAnsweredKey=key(context);$('#question').textContent=current||context;log('manual answer now');generate(current||context,context)}};$('#stop').onclick=()=>{if(answerController){answerController.abort();answerController=null;generation++;$('#latency').textContent='Latency: stopped';setStatus('Listening');controls();log('response stopped')}};$('#debugToggle').onclick=()=>{debug=!debug;$('#debug').classList.toggle('on',debug);$('#debugToggle').textContent=debug?'Hide Debug':'Debug'};setInterval(()=>{if(active&&pending()&&n()-lastSpeech>WATCHDOG&&!observeController&&!answerController)route(true)},500);setInterval(()=>{if(active)render()},2000);controls();
</script></body></html>
